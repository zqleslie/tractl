name: PR Checks

on:
  pull_request:
    branches: [master, main]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format / Vet / Lint / Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/desktop/go.sum

      - name: Server embed stub (go:embed dist/web)
        run: make embed-stub

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: ./...

      - name: Security — govulncheck
        run: make vuln

      - name: Unit tests
        run: make test

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/desktop/go.sum

      - name: Integration tests
        run: make test-integration

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/desktop/go.sum

      - name: E2E tests
        run: make test-e2e

  build:
    name: Build CLI + WASM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-web-assets
        with:
          build-target: build-wasm

      - name: Build CLI binary
        run: make build-cli
