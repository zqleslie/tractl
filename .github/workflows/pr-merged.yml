name: PR Merged — Post Handoff Entry Comment

# Triggers when a PR is merged.
# Finds the issue linked via "Closes #N" in the PR body and posts
# a structured handoff entry comment on that issue.
#
# GitHub auto-closes the linked issue on merge (native behaviour).
# issue-closed.yml then handles moving to Done and unblocking dependents.
#
# Prerequisites:
#   - Secret GH_PROJECT_TOKEN: PAT with scopes repo + project

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  post-handoff-comment:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      # ── 1. Extract linked issue number ───────────────────────────────────────
      - name: Extract linked issue number
        id: extract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ISSUE=$(echo "$PR_BODY" \
            | grep -oiE '(closes|fixes|resolves)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' \
            | head -1)

          if [[ -z "$ISSUE" ]]; then
            echo "No linked issue found — skipping."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true"           >> "$GITHUB_OUTPUT"
            echo "issue_number=$ISSUE"  >> "$GITHUB_OUTPUT"
          fi

      # ── 2. Post handoff entry comment ────────────────────────────────────────
      - name: Post handoff entry comment
        if: steps.extract.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PROJECT_TOKEN }}
          script: |
            const pr    = context.payload.pull_request;
            const issue = parseInt('${{ steps.extract.outputs.issue_number }}');
            const date  = new Date().toISOString().split('T')[0];

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              pull_number: pr.number,
              per_page: 10,
            });

            const fileList = files
              .map(f => `  - \`${f.filename}\` (+${f.additions} -${f.deletions})`)
              .join('\n');

            const moreFiles = files.length === 10
              ? '\n  _...see PR for full list_'
              : '';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issue,
              body: [
                '## Handoff Entry',
                '',
                `**Date:** ${date}`,
                `**PR:** #${pr.number} — [${pr.title}](${pr.html_url})`,
                `**Author:** @${pr.user.login}`,
                `**Merged by:** @${pr.merged_by?.login || 'unknown'}`,
                `**Branch:** \`${pr.head.ref}\` → \`${pr.base.ref}\``,
                '',
                '---',
                '',
                '### Work Summary',
                '> ⚠️ _Update before merging: what was implemented and key decisions made._',
                '',
                '### Files Changed',
                fileList + moreFiles,
                '',
                '### Architectural Notes',
                '> _Import boundary decisions, pattern choices, or constraints future agents must know._',
                '',
                '### Next Required Action',
                '> ⚠️ _Update before merging: what the next session must do first._',
              ].join('\n'),
            });
            